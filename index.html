<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCF9F4" />
  <title>Lớp Mầm Non Độc Lập Hoa Sen — Tham quan ngôi trường 2D tương tác</title>
  <meta
    name="description"
    content="Chuyến tham quan tương tác 2D Flat Isometric giới thiệu Lớp Mầm Non Độc Lập Hoa Sen tại 5P5Q+5G8, Lâm Lộc, Sơn Tịnh, Quảng Ngãi."
  />
  <link rel="icon" type="image/png" href="assets/images/logo-hoa-sen.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>

  <!-- Thanh header nổi không viền tối giản -->
  <header class="top-chrome" id="top-chrome">
    <a class="brand-pill" href="#step-gate" aria-label="Về đầu hành trình Lớp Mầm Non Độc Lập Hoa Sen">
      <span class="brand-lotus">
        <img
          id="brand-logo-img"
          src="assets/images/logo-hoa-sen.png"
          alt="Logo Mầm Non Hoa Sen"
          width="34"
          height="34"
        />
      </span>
      <span class="brand-text">
        <strong id="brand-name">Mầm Non Hoa Sen</strong>
        <small id="brand-sub">Sơn Tịnh • Quảng Ngãi</small>
      </span>
    </a>

    <div class="mobile-progress-pill" id="mobile-progress-pill" aria-live="polite">
      <span class="progress-dot"></span>
      <span id="mobile-step-text">Chặng 1 • Cổng Hoa Sen</span>
    </div>

    <div class="chrome-actions">
      <a class="chrome-link" id="top-contact-link" href="#step-contact">Liên hệ</a>
      <div class="call-menu-wrap" id="call-menu-wrap">
        <button
          type="button"
          class="chrome-cta-circle"
          id="top-call-toggle"
          aria-expanded="false"
          aria-haspopup="true"
          aria-controls="top-call-popover"
          aria-label="Mở danh bạ gọi điện Hoa Sen"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path
              d="M5.4 3.5H8.8C9.3 3.5 9.8 3.9 9.9 4.4L10.6 7.4C10.7 7.9 10.5 8.4 10.1 8.7L8.4 9.9C9.5 12.2 11.4 14.1 13.7 15.2L14.9 13.5C15.2 13.1 15.7 12.9 16.2 13L19.2 13.7C19.7 13.8 20.1 14.3 20.1 14.8V18.2C20.1 19.2 19.2 20 18.2 19.9C10.3 19.4 4.1 13.2 3.6 5.3C3.5 4.3 4.4 3.5 5.4 3.5Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="call-popover" id="top-call-popover" role="menu" hidden>
          <a class="call-popover-item" id="call-opt-canh" role="menuitem" href="tel:0868474194">
            <span class="call-item-name">Gọi Chú Cảnh</span>
            <span class="call-item-phone">0868.474.194</span>
          </a>
          <a class="call-popover-item" id="call-opt-huong" role="menuitem" href="tel:0975551545">
            <span class="call-item-name">Gọi Cô Hường</span>
            <span class="call-item-phone">0975.551.545</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Thanh định vị hành trình tối giản (11 chặng thống nhất) -->
  <nav class="journey-stepper" id="journey-stepper" aria-label="Định vị các chặng tham quan"></nav>

  <!-- MỘT KHỐI SÂN KHẤU THỐNG NHẤT DUY NHẤT (KHÔNG KÉO LÊN XUỐNG GIỮA CÁC CHƯƠNG) -->
  <main id="storybook-main" class="unified-story-root">
    <section class="master-scrollytelling" id="master-scrollytelling" aria-label="Hành trình tham quan tương tác Hoa Sen">
      <!-- Sân khấu ghim cố định chứa bản đồ Isometric, thẻ kể chuyện xuất hiện tại chỗ & 3 cảnh cuối -->
      <div class="master-sticky-viewport" id="stage-viewport">
        <div class="stage-sky-backdrop" id="stage-sky-backdrop" aria-hidden="true"></div>

        <!-- Bản đồ 2D Flat Isometric 30° + đường dẫn chuyện -->
        <div class="stage-canvas" id="stage-canvas">
          <div class="svg-layer-host" id="svg-scene-host"></div>
          <div class="svg-guide-host" id="svg-guide-host"></div>
        </div>

        <div class="stage-bottom-mist" aria-hidden="true"></div>

        <!-- Khung thẻ kể chuyện Chương 1 -> Chương 7 xuất hiện giữa không gian (không kéo lên xuống) -->
        <div class="story-cards-overlay" id="story-cards-overlay"></div>

        <!-- Dây nối hoa sen & 3 cảnh cuối chuyển cảnh mượt trực tiếp trong cùng sân khấu -->
        <div class="epilogue-vine-layer" id="epilogue-vine-layer" aria-hidden="true"></div>

        <div class="epilogue-panels-stage" id="epilogue-panels-stage">
          <!-- Cảnh 8: Khoảnh khắc treo ngẫu nhiên tự nhiên -->
          <div class="epilogue-scene-panel is-gallery" id="panel-gallery" data-epilogue-panel="gallery">
            <div class="band-intro" id="gallery-intro"></div>
            <div class="bunting-gallery-wrap">
              <svg class="bunting-cord-svg" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">
                <path
                  d="M -20 34 Q 260 112, 600 44 T 1220 38"
                  fill="none"
                  stroke="#E87A90"
                  stroke-opacity="0.55"
                  stroke-width="3"
                  stroke-dasharray="8 8"
                  stroke-linecap="round"
                />
                <path
                  d="M -20 96 Q 340 30, 720 105 T 1220 82"
                  fill="none"
                  stroke="#389FAD"
                  stroke-opacity="0.32"
                  stroke-width="2.4"
                  stroke-dasharray="6 8"
                  stroke-linecap="round"
                />
              </svg>
              <div class="photo-bunting-grid" id="photo-bunting-grid"></div>
            </div>
            <p class="gallery-note" id="gallery-note"></p>
          </div>

          <!-- Cảnh 9: Vườn Hoa Sen — Đội ngũ cô giáo -->
          <div class="epilogue-scene-panel is-teachers" id="panel-teachers" data-epilogue-panel="teachers">
            <div class="garden-decor-back" id="garden-decor-back" aria-hidden="true"></div>
            <div class="band-intro" id="teachers-intro"></div>
            <div class="teachers-garden-grid" id="teachers-garden-grid"></div>
            <div class="garden-decor-front" id="garden-decor-front" aria-hidden="true"></div>
          </div>

          <!-- Cảnh 10: Bưu thiếp chiều nắng ấm — Liên hệ & Bản đồ -->
          <div class="epilogue-scene-panel is-contact" id="panel-contact" data-epilogue-panel="contact">
            <div class="sunset-glow" aria-hidden="true"></div>
            <div class="postcard-layout">
              <div class="mini-gate-art" id="mini-gate-art" aria-hidden="true"></div>
              <article class="postcard-card" id="postcard-card" aria-label="Thông tin liên hệ Lớp Mầm Non Độc Lập Hoa Sen"></article>
            </div>
          </div>
        </div>
      </div>

      <!-- Đường ray nhịp cuộn vô hình điều phối toàn bộ 11 điểm dừng (Chặng 1 -> Chặng 10) -->
      <div class="master-scroll-track" id="master-scroll-track" aria-hidden="true"></div>
    </section>
  </main>

  <!-- Lightbox phóng to ảnh hoạt động thật -->
  <div class="lightbox" id="photo-lightbox" data-lenis-prevent role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
    <div class="lightbox-backdrop" data-lightbox-close></div>
    <div class="lightbox-panel">
      <button class="lightbox-close" type="button" id="lightbox-close-btn" aria-label="Đóng ảnh">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </button>

      <div class="lightbox-stage">
        <button class="lightbox-nav prev" type="button" id="lightbox-prev-btn" aria-label="Ảnh trước">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
            <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <figure class="lightbox-figure" id="lightbox-figure">
          <img id="lightbox-img" src="" alt="" decoding="async" />
          <figcaption class="lightbox-caption">
            <span class="lightbox-tag" id="lightbox-tag"></span>
            <h3 id="lightbox-title"></h3>
            <p id="lightbox-desc"></p>
            <span class="lightbox-counter" id="lightbox-counter"></span>
          </figcaption>
        </figure>

        <button class="lightbox-nav next" type="button" id="lightbox-next-btn" aria-label="Ảnh sau">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
            <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
